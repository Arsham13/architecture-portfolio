<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Estedad, Tahoma, sans-serif">
  <rect width="1200" height="800" fill="#F3F1EC"/>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7a7468" stroke-width="0.5" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#g)"/>
  <!-- outer frame -->
  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#1f1d18" stroke-width="1"/>
  <!-- title block -->
  <text x="60" y="74" font-size="14" fill="#1f1d18" font-weight="700" letter-spacing="2">مجموعه فرهنگی — پلان همکف</text>
  <text x="60" y="94" font-size="11" fill="#7a7468" letter-spacing="1">طبقه همکف / مقیاس نمایشی</text>
  <!-- central plaza -->
  <rect x="440" y="280" width="320" height="240" fill="#7a7468" opacity="0.1" stroke="#7a7468" stroke-width="0.75" stroke-dasharray="4 4"/>
  <text x="600" y="400" font-size="11" fill="#1f1d18" text-anchor="middle">میدان مرکزی</text>
  <!-- offset volumes -->
  <g stroke="#1f1d18" stroke-width="1.5" fill="none">
    <rect x="120" y="180" width="280" height="180"/>
    <rect x="800" y="180" width="280" height="220"/>
    <rect x="120" y="480" width="320" height="160"/>
    <rect x="820" y="440" width="260" height="200"/>
  </g>
  <text x="180" y="260" font-size="11" fill="#1f1d18">گالری</text>
  <text x="860" y="260" font-size="11" fill="#1f1d18">کارگاه</text>
  <text x="180" y="560" font-size="11" fill="#1f1d18">کافه</text>
  <text x="880" y="520" font-size="11" fill="#1f1d18">فضای هم‌اندیشی</text>
  
  <g>
    <circle cx="440" cy="280" r="11" fill="none" stroke="#1f1d18" stroke-width="1"/>
    <text x="440" y="284" font-size="11" fill="#1f1d18" text-anchor="middle" font-weight="700">B</text>
  </g>
  
  <g>
    <circle cx="440" cy="520" r="11" fill="none" stroke="#1f1d18" stroke-width="1"/>
    <text x="440" y="524" font-size="11" fill="#1f1d18" text-anchor="middle" font-weight="700">B'</text>
  </g>
  </svg>