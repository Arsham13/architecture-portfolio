<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Estedad, Tahoma, sans-serif">
  <rect width="1200" height="800" fill="#F3F1EC"/>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7a7468" stroke-width="0.5" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#g)"/>
  <!-- outer frame -->
  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#1f1d18" stroke-width="1"/>
  <!-- title block -->
  <text x="60" y="74" font-size="14" fill="#1f1d18" font-weight="700" letter-spacing="2">خانه حیاط مرکزی — پلان همکف</text>
  <text x="60" y="94" font-size="11" fill="#7a7468" letter-spacing="1">طبقه همکف / مقیاس نمایشی</text>
  <!-- outer perimeter -->
  <rect x="120" y="160" width="960" height="560" fill="none" stroke="#1f1d18" stroke-width="1.5"/>
  <!-- central courtyard -->
  <rect x="490" y="310" width="220" height="180" fill="none" stroke="#1f1d18" stroke-width="1.5"/>
  <!-- pool -->
  <rect x="550" y="380" width="100" height="40" fill="#7a7468" opacity="0.15" stroke="#7a7468" stroke-width="0.75"/>
  <text x="600" y="404" font-size="10" fill="#7a7468" text-anchor="middle">استخر</text>
  <!-- tree -->
  <circle cx="520" cy="340" r="14" fill="none" stroke="#1f1d18" stroke-width="0.75"/>
  <circle cx="680" cy="460" r="14" fill="none" stroke="#1f1d18" stroke-width="0.75"/>
  <!-- room labels -->
  <text x="160" y="240" font-size="11" fill="#1f1d18">پذیرایی</text>
  <text x="940" y="240" font-size="11" fill="#1f1d18">آشپزخانه</text>
  <text x="160" y="600" font-size="11" fill="#1f1d18">خواب مهمان</text>
  <text x="940" y="600" font-size="11" fill="#1f1d18">خدمات</text>
  <!-- entry -->
  <line x1="120" y1="400" x2="100" y2="400" stroke="#1f1d18" stroke-width="1.5"/>
  <text x="80" y="420" font-size="10" fill="#1f1d18" text-anchor="end">ورودی</text>
  
  <g stroke="#7a7468" stroke-width="0.75" fill="none">
    <line x1="120" y1="720" x2="1080" y2="720"/>
    <line x1="120" y1="716" x2="120" y2="724"/>
    <line x1="1080" y1="716" x2="1080" y2="724"/>
  </g>
  <text x="600" y="714" font-size="10" fill="#7a7468" text-anchor="middle" letter-spacing="1">عرض</text>
  
  <g>
    <circle cx="490" cy="310" r="11" fill="none" stroke="#1f1d18" stroke-width="1"/>
    <text x="490" y="314" font-size="11" fill="#1f1d18" text-anchor="middle" font-weight="700">A</text>
  </g>
  
  <g>
    <circle cx="490" cy="490" r="11" fill="none" stroke="#1f1d18" stroke-width="1"/>
    <text x="490" y="494" font-size="11" fill="#1f1d18" text-anchor="middle" font-weight="700">A'</text>
  </g>
  </svg>