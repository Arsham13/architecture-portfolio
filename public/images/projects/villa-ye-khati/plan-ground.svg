<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Estedad, Tahoma, sans-serif">
  <rect width="1200" height="800" fill="#F3F1EC"/>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7a7468" stroke-width="0.5" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#g)"/>
  <!-- outer frame -->
  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#1f1d18" stroke-width="1"/>
  <!-- title block -->
  <text x="60" y="74" font-size="14" fill="#1f1d18" font-weight="700" letter-spacing="2">ویلای خطی — پلان همکف</text>
  <text x="60" y="94" font-size="11" fill="#7a7468" letter-spacing="1">طبقه همکف / مقیاس نمایشی</text>
  <!-- site -->
  <rect x="80" y="140" width="1040" height="420" fill="none" stroke="#7a7468" stroke-width="0.5" stroke-dasharray="4 4"/>
  <!-- main volume -->
  <rect x="140" y="220" width="920" height="160" fill="none" stroke="#1f1d18" stroke-width="1.5"/>
  <!-- central void break -->
  <rect x="560" y="220" width="80" height="160" fill="#F3F1EC" stroke="#1f1d18" stroke-width="1.5"/>
  <circle cx="600" cy="300" r="18" fill="none" stroke="#9c4a2e" stroke-width="1"/>
  <text x="600" y="304" font-size="10" fill="#9c4a2e" text-anchor="middle">حیاط</text>
  <!-- secondary wing -->
  <rect x="140" y="420" width="920" height="100" fill="none" stroke="#1f1d18" stroke-width="1.5"/>
  <!-- labels -->
  <text x="220" y="310" font-size="11" fill="#1f1d18">پذیرایی</text>
  <text x="920" y="310" font-size="11" fill="#1f1d18">آشپزخانه</text>
  <text x="220" y="480" font-size="11" fill="#1f1d18">خواب اصلی</text>
  <!-- entry -->
  <line x1="140" y1="540" x2="140" y2="580" stroke="#1f1d18" stroke-width="1"/>
  <text x="150" y="575" font-size="10" fill="#1f1d18">ورودی</text>
  
  <g stroke="#7a7468" stroke-width="0.75" fill="none">
    <line x1="140" y1="600" x2="1060" y2="600"/>
    <line x1="140" y1="596" x2="140" y2="604"/>
    <line x1="1060" y1="596" x2="1060" y2="604"/>
  </g>
  <text x="600" y="594" font-size="10" fill="#7a7468" text-anchor="middle" letter-spacing="1">طول حجم اصلی</text>
  
  <g stroke="#7a7468" stroke-width="0.75" fill="none">
    <line x1="1080" y1="220" x2="1080" y2="540"/>
    <line x1="1080" y1="216" x2="1080" y2="224"/>
    <line x1="1080" y1="536" x2="1080" y2="544"/>
  </g>
  <text x="1080" y="214" font-size="10" fill="#7a7468" text-anchor="middle" letter-spacing="1">عرض</text>
  
  <g>
    <circle cx="200" cy="220" r="11" fill="none" stroke="#1f1d18" stroke-width="1"/>
    <text x="200" y="224" font-size="11" fill="#1f1d18" text-anchor="middle" font-weight="700">A</text>
  </g>
  
  <g>
    <circle cx="1000" cy="220" r="11" fill="none" stroke="#1f1d18" stroke-width="1"/>
    <text x="1000" y="224" font-size="11" fill="#1f1d18" text-anchor="middle" font-weight="700">A'</text>
  </g>
  </svg>