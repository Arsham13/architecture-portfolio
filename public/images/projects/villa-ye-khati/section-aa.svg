<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Estedad, Tahoma, sans-serif">
  <rect width="1200" height="800" fill="#F3F1EC"/>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7a7468" stroke-width="0.5" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#g)"/>
  <!-- outer frame -->
  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#1f1d18" stroke-width="1"/>
  <!-- title block -->
  <text x="60" y="74" font-size="14" fill="#1f1d18" font-weight="700" letter-spacing="2">ویلای خطی — برش A-A</text>
  <text x="60" y="94" font-size="11" fill="#7a7468" letter-spacing="1">برش طولی / نمایشی</text>
  <!-- ground line -->
  <line x1="100" y1="500" x2="1100" y2="500" stroke="#1f1d18" stroke-width="1.5"/>
  <g stroke="#7a7468" stroke-width="0.5" stroke-dasharray="2 4">
    <line x1="100" y1="500" x2="100" y2="560"/>
    <line x1="1100" y1="500" x2="1100" y2="560"/>
  </g>
  <text x="120" y="540" font-size="10" fill="#7a7468">سطح زمین</text>
  <!-- ground floor -->
  <rect x="160" y="380" width="880" height="120" fill="none" stroke="#1f1d18" stroke-width="1.5"/>
  <!-- first floor -->
  <rect x="160" y="240" width="880" height="140" fill="none" stroke="#1f1d18" stroke-width="1.5"/>
  <!-- central void (double height) -->
  <rect x="550" y="240" width="100" height="260" fill="#F3F1EC" stroke="#1f1d18" stroke-width="1"/>
  <!-- roof -->
  <line x1="160" y1="240" x2="1040" y2="240" stroke="#1f1d18" stroke-width="1.5"/>
  <!-- light arrow -->
  <line x1="600" y1="180" x2="600" y2="240" stroke="#9c4a2e" stroke-width="1"/>
  <polygon points="594,234 606,234 600,246" fill="#9c4a2e"/>
  <text x="612" y="210" font-size="10" fill="#9c4a2e">نور</text>
  
  <g stroke="#7a7468" stroke-width="0.75" fill="none">
    <line x1="160" y1="580" x2="1040" y2="580"/>
    <line x1="160" y1="576" x2="160" y2="584"/>
    <line x1="1040" y1="576" x2="1040" y2="584"/>
  </g>
  <text x="600" y="574" font-size="10" fill="#7a7468" text-anchor="middle" letter-spacing="1">برش طولی</text>
  </svg>